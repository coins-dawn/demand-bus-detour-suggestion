<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かわまる 通院寄り道シミュレーション</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1><a href="./" class="home">かわまる 通院寄り道シミュレーション</a></h1>
  <a class="about" href="about.html"><span class="ic ic-information-outline"></span>このサービスについて</a>
</header>
<div class="app">
  <aside class="pane" id="pane">
    <label class="sample">サンプルの探索条件<select id="sample"></select></label>
    <form id="form" class="card" onsubmit="return false">
      <label>出発地（家の近くのバス停）<select id="from"></select></label>
      <label>目的地（病院）<select id="to"></select></label>
      <label>日付<button type="button" id="date" class="pick"></button></label>
      <label>予約時刻<button type="button" id="time" class="pick"></button></label>
      <label>診察にかかる時間<select id="dur"></select></label>
      <button type="submit" id="go" disabled>便をさがす</button>
    </form>
  </aside>

  <section class="mid" id="mid" hidden>
   <div class="mid-res">
    <div class="stepper" id="stepper"></div>
    <div class="res-body" id="res-body">
      <section id="v-go">
        <h2><span class="ic ic-hospital-building"></span>行きの経路をえらぶ</h2>
        <p class="sub" id="go-sub"></p>
        <div id="go-notes"></div>
        <div id="go-list" class="list"></div>
        <div class="res-foot"><button id="to-back" class="next">帰りの経路を選択にすすむ</button></div>
      </section>
      <section id="v-back" hidden>
        <h2><span class="ic ic-home-variant"></span>帰りの経路をえらぶ</h2>
        <p class="sub" id="back-sub"></p>
        <div id="back-notes"></div>
        <div id="back-list" class="list"></div>
        <div class="res-foot"><button id="to-all" class="next back">経路全体を確認する</button></div>
      </section>
      <section id="v-all" hidden>
        <h2><span class="ic ic-clock-outline"></span>経路全体</h2>
        <div id="all-body"></div>
      </section>
    </div>
   </div>
  </section>

  <div class="pop" id="pop" hidden>
    <div class="pop-head"><b id="pop-title"></b><button type="button" id="pop-close" aria-label="閉じる"><span class="ic ic-close"></span></button></div>
    <div id="pop-body"></div>
  </div>

  <main class="mapwrap">
    <div id="map"></div>
    <div class="layers" id="layers">
      <div class="layers-ttl"><span class="ic ic-layers-outline"></span>表示</div>
      <label><input type="checkbox" id="ly-stops" checked>かわまるのバス停</label>
      <label><input type="checkbox" id="ly-hosps" checked>病院・診療所</label>
      <label><input type="checkbox" id="ly-spots">寄り道のスポット</label>
      <label><input type="checkbox" id="ly-rail">JR・東武東上線</label>
    </div>
    <div class="legend" id="legend"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="engine.js"></script>
<script src="planner.js"></script>
<script src="trip.js"></script>
<script src="app.js"></script>
</body>
</html>
