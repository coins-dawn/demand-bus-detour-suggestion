<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かわまる 通院寄り道シミュレーション</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>かわまる 通院寄り道シミュレーション</h1>
  <a class="about" href="about.html"><span class="ic ic-information-outline"></span>このサービスについて</a>
</header>
<div class="app">
  <aside class="pane go" id="pane">
    <div class="dir" id="dir" role="radiogroup" aria-label="行き・帰り">
      <button type="button" role="radio" data-d="go" aria-checked="true"><span class="ic ic-hospital-building"></span>行き</button>
      <button type="button" role="radio" data-d="back" aria-checked="false"><span class="ic ic-home-variant"></span>帰り</button>
      <span class="knob" aria-hidden="true"></span>
    </div>

    <form id="form" class="card" onsubmit="return false">
      <label>地区<select id="dist"></select></label>
      <label><span id="lab-from"></span><select id="from"></select></label>
      <label><span id="lab-to"></span><select id="to"></select></label>
      <label>日付<button type="button" id="date" class="pick"></button></label>
      <label><span id="lab-time"></span><button type="button" id="time" class="pick"></button></label>
      <p class="hint">地図のバス停や病院を押して選ぶこともできます。</p>
      <button type="submit" id="go" disabled>便をさがす</button>
    </form>
  </aside>

  <section class="mid" id="mid" hidden>
   <div class="mid-res">
    <div class="stepper" id="stepper"></div>
    <div class="res-body" id="res-body">
      <section id="v-list">
        <h2 id="list-title"></h2>
        <p class="sub" id="list-sub"></p>
        <div id="notes"></div>
        <div id="list" class="list"></div>
        <div class="res-foot"><button id="to-all" class="next">経路全体を確認する</button></div>
      </section>
      <section id="v-all" hidden>
        <h2><span class="ic ic-clock-outline"></span>経路全体</h2>
        <div id="all-body"></div>
      </section>
    </div>
   </div>
  </section>

  <div class="pop" id="pop" hidden>
    <div class="pop-head"><b id="pop-title"></b><button type="button" id="pop-close" aria-label="閉じる"><span class="ic ic-close"></span></button></div>
    <div id="pop-body"></div>
  </div>

  <main class="mapwrap">
    <div id="map"></div>
    <div class="layers" id="layers">
      <div class="layers-ttl"><span class="ic ic-layers-outline"></span>表示</div>
      <label><input type="checkbox" id="ly-stops" checked>かわまるのバス停</label>
      <label><input type="checkbox" id="ly-hosps" checked>病院・診療所</label>
      <label><input type="checkbox" id="ly-spots">寄り道のスポット</label>
      <label><input type="checkbox" id="ly-rail">JR・東武東上線</label>
    </div>
    <div class="legend" id="legend"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="engine.js"></script>
<script src="planner.js"></script>
<script src="trip.js"></script>
<script src="app.js"></script>
</body>
</html>
